<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }
    body{
        font-family: 'Poppins', sans-serif;
        background: #00c6ff;
        overflow: hidden;
    }

    .outer-box{
        width: 100vw;
        height: 100vh;
        background: linear-gradient(to top left,#3ed8ff, #a8f5ff);
        position: relative;
    }

    .inner-box{
        width: 400px;
        margin: 0 auto;
        position: relative;
        top: 50%;
        transform: translateY(-50%);
        padding: 30px 40px;
        background: rgba(255,255,255,0.3);
        backdrop-filter: blur(10px);
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0,0,0,0.2);
        transition: 0.4s ease-in-out;
    }

    .inner-box:hover{
        transform: translateY(-53%) scale(1.03);
        box-shadow: 0 0 25px rgba(46,154,255,0.7);
    }

    .signup-header h1{
        font-size: 2.3rem;
        color:#212121;
        text-align: center;
        margin-bottom: 10px;
        animation: fade-in 1s ease-in-out;
    }

    @keyframes fade-in{
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .signup-body{
        margin: 25px 0;
    }

    .signup-body p{
        margin: 12px 0;
    }

    .signup-body p label{
        display:block;
        font-weight:600;
    }

    .signup-body p input{
        width:100%;
        padding: 10px;
        border: none;
        border-bottom: 2px solid #ccc;
        outline: none;
        font-size: 1rem;
        background: transparent;
        transition: 0.3s ease;
    }

    .signup-body p input:focus{
        border-color: #2e9aff;
        transform: scale(1.03);
    }

    .signup-body p input[type="submit"]{
        background-color: #3489db;
        border: none;
        color:white;
        cursor:pointer;
        font-size: 1.1rem;
        font-weight: bold;
        border-radius: 6px;
        padding: 12px;
        margin-top: 10px;
        transition: 0.3s;
    }

    .signup-body p input[type="submit"]:hover{
        background-color: #2e9aff;
        box-shadow: 0 0 12px #2e9aff;
        transform: translateY(-3px);
    }

    .signup-footer p{
        color: #222;
        text-align:center;
    }

    .signup-footer p a{
        color:#2e9aff;
        font-weight: bold;
        text-decoration: none;
        transition: 0.3s;
    }

    .signup-footer p a:hover{
        text-decoration: underline;
        color:#056ac9;
    }

    .circle{
        width: 200px;
        height:200px;
        border-radius: 100px;
        background: linear-gradient(to top right, #ffffffaa, #ffffffff);
        position: absolute;
        animation: move 6s infinite alternate ease-in-out;
    }

    .c1{
        top: 100px;
        left: 40px;
    }

    .c2{
        bottom: 200px;
        right: 50px;
    }

    @keyframes move {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(30px) rotate(45deg); }
    }

</style>

</head>

<body>

    <div class="outer-box">
        <div class="inner-box">
            <header class="signup-header">
                <h1>Signup</h1>
            </header>

            <main class="signup-body">
                <form action="#">
                    <p>
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" required>
                    </p>

                    <p>
                        <label for="email">Your Email</label>
                        <input type="email" id="email" required>
                    </p>

                    <p>
                        <label for="password">Your Password</label>
                        <input type="password" id="password" placeholder="Minimum 8 characters" required>
                    </p>

                    <p>
                        <input type="submit" id="submit" value="Create Account">
                    </p>
                </form>
            </main>

            <footer class="signup-footer">
                <p>Already Have an Account? <a href="#">Login</a></p>
            </footer>
        </div>

        <div class="circle c1"></div>
        <div class="circle c2"></div>
    </div>

</body>
</html>
